<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Chivalry 2 TO Tier List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="hero hero--admin">
      <div class="hero__shade"></div>
      <nav class="topbar" aria-label="Admin navigation">
        <a class="brand" href="/">TO Tier List</a>
        <div class="topbar__actions">
          <a class="button button--ghost" href="/">View Site</a>
          <a class="button button--ghost" href="https://discord.gg/7MmJHwCGd" target="_blank" rel="noopener noreferrer">Discord</a>
        </div>
      </nav>
      <section class="hero__content">
        <p class="eyebrow">Private Admin</p>
        <h1>Manage player rankings.</h1>
        <p class="hero__copy">Add players, update tiers, reorder placements, and export your current list.</p>
      </section>
    </header>

    <main>
      <section class="admin-panel" id="admin">
        <div class="admin-panel__head">
          <div>
            <p class="eyebrow">Admin Control</p>
            <h2>Manage the list</h2>
          </div>
          <div class="topbar__actions">
            <button class="button button--dark" id="exportData" type="button">Export Data</button>
            <button class="button button--ghost" id="resetDemo" type="button">Reset Demo</button>
          </div>
        </div>

        <div class="admin-lock" id="adminLock">
          <label>
            <span>Admin password</span>
            <input id="adminCode" type="password" placeholder="Enter admin password">
          </label>
          <button class="button" id="unlockAdmin" type="button">Unlock</button>
          <p class="hint">Use the admin password configured on the server.</p>
        </div>

        <div class="admin-workspace" id="adminWorkspace" hidden>
          <section class="admin-tools" aria-label="List and region controls">
            <label>
              <span>Managing list</span>
              <select id="adminListType"></select>
            </label>
            <form class="region-form" id="regionForm">
              <label>
                <span>Add region</span>
                <input id="newRegion" maxlength="24" placeholder="NA East">
              </label>
              <button class="button" type="submit">Add Region</button>
            </form>
            <div class="region-list" id="regionList"></div>
          </section>

          <form class="player-form" id="playerForm">
            <input id="playerId" type="hidden">
            <label>
              <span>Player name</span>
              <input id="playerName" required maxlength="40" placeholder="Example: Sir Objective">
            </label>
            <label>
              <span>Tier</span>
              <select id="playerTier" required></select>
            </label>
            <label>
              <span>Region</span>
              <select id="playerRegion" required></select>
            </label>
            <label>
              <span>Role</span>
              <input id="playerRole" maxlength="28" placeholder="Frontline / Engineer">
            </label>
            <label>
              <span>Clan or team</span>
              <input id="playerClan" maxlength="28" placeholder="Optional">
            </label>
            <label>
              <span>PlayFab ID</span>
              <input id="playerPlayfabId" maxlength="64" placeholder="EFEA435B1E22C73C">
            </label>
            <label>
              <span>Discord username</span>
              <input id="playerDiscordUsername" maxlength="64" placeholder="username or display name">
            </label>
            <label class="player-form__wide">
              <span>Notes</span>
              <textarea id="playerNotes" rows="3" maxlength="180" placeholder="Short reason for placement"></textarea>
            </label>
            <div class="form-actions">
              <button class="button" type="submit">Save Player</button>
              <button class="button button--ghost" id="clearForm" type="button">Clear</button>
            </div>
          </form>

          <section class="review-panel" aria-labelledby="review-title">
            <div>
              <p class="eyebrow">Review Queue</p>
              <h2 id="review-title">Pending submissions</h2>
            </div>
            <div class="submission-list" id="submissionList"></div>
          </section>

          <div class="admin-list" id="adminList"></div>
        </div>
      </section>
    </main>

    <script src="admin.js?v=playfab-error-stages-20260611"></script>
  </body>
</html>
